name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'VERSION must contain a MAJOR.MINOR.PATCH value; got: %s\n' "$version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Release tag %s does not match VERSION v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  test-suite:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests

  linux-appimage:
    needs: [release-version, test-suite]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build-linux.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build-linux.txt
      - name: Install pinned appimagetool
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$tool"
          echo "b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2  $tool" | sha256sum --check
          chmod +x "$tool"
          APPIMAGE_EXTRACT_AND_RUN=1 "$tool" --version
      - name: Build AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool-x86_64.AppImage" ./build_linux.sh
      - name: Smoke-test bundled application
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/inkwell-app.log"
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20s dist/linux/TheInkwell/TheInkwell >"$log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 124 ]]; then
            cat "$log" >&2
            printf 'Bundled application did not remain active; exit code %s\n' "$status" >&2
            exit 1
          fi
      - name: Verify AppImage artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="dist/linux/TheInkwell.AppImage"
          test -s "$artifact"
          file "$artifact"
          python -c 'from pathlib import Path; artifact = Path("dist/linux/TheInkwell.AppImage"); f = artifact.open("rb"); f.seek(8); assert f.read(3) == b"AI\x02", "missing AppImage type 2 signature"'
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TheInkwell-Linux-${{ needs.release-version.outputs.version }}
          path: dist/linux/TheInkwell.AppImage
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    needs: [release-version, test-suite]
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build-windows.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build-windows.txt
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" `
            -OutFile $installer

          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup installer checksum mismatch: $actualHash"
          }

          $install = Start-Process -FilePath $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($install.ExitCode)."
          }

          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Pinned Inno Setup compiler was not found at $iscc"
          }
          $compilerVersion = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          if ($compilerVersion -notlike "6.7.3*") {
            throw "Expected Inno Setup 6.7.3, found $compilerVersion."
          }
      - name: Build and install-test Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Pinned Inno Setup compiler was not found at $iscc"
          }

          ./build_windows.ps1 -CreateInstaller -InnoSetupCompiler $iscc

          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $installer = Join-Path $PWD "dist\windows\TheInkwellSetup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Windows installer was not created: $installer"
          }
          if ((Get-Item -LiteralPath $installer).Length -le 0) {
            throw "Windows installer is empty: $installer"
          }
          if ((Get-Item -LiteralPath $installer).VersionInfo.ProductVersion -ne $version) {
            throw "Installer version does not match VERSION $version."
          }

          $installDirectory = Join-Path $env:RUNNER_TEMP "TheInkwell-install"
          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installDirectory"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer smoke test failed with exit code $LASTEXITCODE."
          }

          $installedExecutable = Join-Path $installDirectory "TheInkwell.exe"
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "The installer did not install TheInkwell.exe."
          }
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installedExecutable)
          if ($versionInfo.ProductVersion -ne $version) {
            throw "Installed product version '$($versionInfo.ProductVersion)' does not match VERSION '$version'."
          }

          $uninstaller = Join-Path $installDirectory "unins000.exe"
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer uninstall smoke test failed with exit code $LASTEXITCODE."
          }
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TheInkwell-Windows-${{ needs.release-version.outputs.version }}
          path: dist/windows/TheInkwellSetup.exe
          if-no-files-found: error
          retention-days: 30
